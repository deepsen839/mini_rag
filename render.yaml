services:
  - type: web
    name: minirag-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: minirag_documents
